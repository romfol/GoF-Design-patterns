image: ghcr.io/foundry-rs/foundry:latest

variables:
  FOUNDRY_PROFILE: ci

stages:
  - build
  - test

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - cache/
    - out/

build:
  stage: build
  script:
    - forge build --sizes
  artifacts:
    paths:
      - out/
    expire_in: 1 hour

test:
  stage: test
  script:
    - forge test -vvv --gas-report
  artifacts:
    expire_in: 1 week
