image: ghcr.io/foundry-rs/foundry:latest

variables:
  FOUNDRY_PROFILE: ci

stages:
  - build
  - test

# Cache Foundry artifacts between runs
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - cache/
    - out/

build:
  stage: build
  script:
    - forge build --sizes
  artifacts:
    paths:
      - out/
    expire_in: 1 hour

test:
  stage: test
  script:
    - forge test -vvv --gas-report
  coverage:
    - forge coverage --report lcov
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - lcov.info
    expire_in: 1 week
